server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prefer exact files and prerendered *.html, then the SPA shell (200.html).
    location / {
        try_files $uri $uri.html $uri/ /200.html;
    }

    location = /200.html {
        add_header Cache-Control "no-cache";
    }
}
