adminGroup: system-admins
groups:
  - media-users
  - media-admins
applications:
  - id: media
    name: Media
    description: Films and series (local dummy stack).
    url: http://localhost:8080
    icon: media.svg
    groups: [media-users]
    services:
      - id: jellyfin
        name: Jellyfin
        # Literal docker container names — must match container_name in compose.yaml.
        containers: [jellyfin]
      - id: db
        name: Database
        containers: [jellyfin-db]
        groups: [media-admins]
