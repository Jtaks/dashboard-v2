adminGroup: system-admins
groups:
  - media-users
  - media-admins
  - docs-users
applications:
  - id: media
    name: Media
    description: Films and series.
    url: https://media.example.com
    icon: media.svg
    groups: [media-users]
    requestable: false
    services:
      - id: jellyfin
        name: Jellyfin
        containers: [jellyfin]
      - id: db
        name: Database
        containers: [jellyfin-db]
        groups: [media-admins]
      - id: docs-link
        name: Docs
        containers: []
  - id: docs
    name: Docs
    description: Internal docs.
    url: https://docs.example.com
    icon: docs.svg
    groups: [docs-users]
    requestable: true
    services:
      - id: wiki
        name: Wiki
        containers: [wiki]
